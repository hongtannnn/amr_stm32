ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Nguồn 1: Odometry bánh xe từ STM32
    odom0: /odom
    # Chỉ lấy vận tốc tịnh tiến vx (index 6) và vận tốc góc quay quanh trục z (index 11)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # Nguồn 2: IMU từ STM32 (con quay hồi chuyển Gyroscope)
    imu0: /imu/data_raw
    # Chỉ lấy vận tốc góc quay quanh trục z (index 11)
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
